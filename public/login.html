<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to Classroom Hub"><title>Sign in · Classroom Hub</title><link rel="icon" href="/assets/school-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/app.css"><script src="/js/auth.js" defer></script></head><body class="auth-body"><header class="topbar"><a class="brand" href="/login.html"><span class="brand-mark">CH</span><span><strong>Classroom Hub</strong><small>Learning, shared</small></span></a><img class="school-logo" src="/assets/school-logo.svg" alt="School logo"></header><main class="auth-shell"><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Use your school Gmail account to continue.</p><form id="login-form" class="form-stack"><label class="field"><span>Gmail address</span><input name="email" type="email" autocomplete="username" required></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><div id="twofa-field" hidden><label class="field"><span>Authenticator code</span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></label></div><button class="button primary" type="submit">Sign in</button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form><div class="auth-links"><a href="/forgot.html">Forgot password?</a><a href="/signup.html">Create an account</a></div><p class="fine-print">By using this site, you agree to the <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p></section></main><footer class="site-footer centered"><span>Only essential cookies are used.</span><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></footer></body></html>
