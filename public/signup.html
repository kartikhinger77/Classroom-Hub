<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create a Classroom Hub account"><title>Create account · Classroom Hub</title><link rel="icon" href="/assets/school-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/app.css"><script src="/js/auth.js" defer></script></head><body class="auth-body"><header class="topbar"><a class="brand" href="/login.html"><span class="brand-mark">CH</span><span><strong>Classroom Hub</strong><small>Learning, shared</small></span></a><img class="school-logo" src="/assets/school-logo.svg" alt="School logo"></header><main class="auth-shell"><section class="auth-card"><p class="eyebrow">JOIN YOUR CLASS</p><h1>Create an account</h1><form id="signup-form" class="form-stack"><label class="field"><span>Full name</span><input name="name" autocomplete="name" maxlength="100" required></label><label class="field"><span>Gmail address</span><input name="email" type="email" autocomplete="email" required></label><label class="field"><span>Role</span><select name="role" required><option value="student">Student</option><option value="teacher">Teacher</option></select></label><label class="field"><span>Password</span><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters, including uppercase, lowercase, and a number.</small></label><div class="strength" aria-live="polite"><div class="strength-track"><span id="strength-fill"></span></div><span id="strength-label">Password strength</span></div><label class="check-line"><input name="policyAccepted" type="checkbox" required><span>I agree to the <a href="/terms.html">Terms</a> and have read the <a href="/privacy.html">Privacy Policy</a>.</span></label><p class="fine-print">Students under the school’s minimum age need a teacher or admin to create their account instead of signing up here.</p><button class="button primary" type="submit">Create account</button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form><div class="auth-links"><a href="/login.html">Already have an account? Sign in</a></div></section></main><footer class="site-footer centered"><span>Only essential cookies are used.</span><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></footer></body></html>
