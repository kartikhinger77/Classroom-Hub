<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password · Classroom Hub</title><link rel="icon" href="/assets/school-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/app.css"><script src="/js/auth.js" defer></script></head><body class="auth-body"><header class="topbar"><a class="brand" href="/login.html"><span class="brand-mark">CH</span><span><strong>Classroom Hub</strong><small>Learning, shared</small></span></a><img class="school-logo" src="/assets/school-logo.svg" alt="School logo"></header><main class="auth-shell"><section class="auth-card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><form id="reset-form" class="form-stack"><label class="field"><span>New password</span><input name="password" type="password" minlength="8" autocomplete="new-password" required></label><small>At least 8 characters with uppercase, lowercase, and a number.</small><button class="button primary" type="submit">Save password</button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form><a href="/login.html">Back to sign in</a></section></main></body></html>
