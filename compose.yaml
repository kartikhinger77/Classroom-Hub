services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/classroom_hub?authSource=admin
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"
    volumes:
      - classroom_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
    init: true

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set local MongoDB username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set local MongoDB password}
    volumes:
      - classroom_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  classroom_uploads:
  classroom_mongodb:
